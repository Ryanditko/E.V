<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="E.V. arc reactor emblem">
  <title>E.V. — arc reactor</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#0a2630"/>
      <stop offset="0.6" stop-color="#07181f"/>
      <stop offset="1" stop-color="#040d12"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2ffff"/>
      <stop offset="0.35" stop-color="#c8f3f5"/>
      <stop offset="0.72" stop-color="#85dbe1"/>
      <stop offset="1" stop-color="#1f7d8a"/>
    </radialGradient>
    <linearGradient id="seg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f0f3"/>
      <stop offset="1" stop-color="#4fb8c0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base disc -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#4fb8c0" stroke-width="1.5" opacity="0.35"/>

  <!-- outer thin ring -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#6fd0d7" stroke-width="2" opacity="0.55"/>

  <!-- fine tick marks around the rim -->
  <g stroke="#8fdde2" stroke-width="2" opacity="0.5">
    <g transform="translate(128 128)">
      <line x1="0" y1="-118" x2="0" y2="-108"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(45)"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(90)"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(135)"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(180)"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(225)"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(270)"/>
      <line x1="0" y1="-118" x2="0" y2="-108" transform="rotate(315)"/>
    </g>
  </g>

  <!-- segmented reactor ring: dark base + lit segments (8 panes) -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#0e2e33" stroke-width="34"/>
  <circle cx="128" cy="128" r="88" fill="none" stroke="url(#seg)" stroke-width="30"
          stroke-dasharray="52 17.2" transform="rotate(-90 128 128)" filter="url(#glow)" opacity="0.92"/>
  <!-- crisp inner + outer edges of the segmented ring -->
  <circle cx="128" cy="128" r="103" fill="none" stroke="#c8f3f5" stroke-width="1.2" opacity="0.55"/>
  <circle cx="128" cy="128" r="73" fill="none" stroke="#c8f3f5" stroke-width="1.2" opacity="0.55"/>

  <!-- inner bright ring -->
  <circle cx="128" cy="128" r="60" fill="none" stroke="#9fe0e4" stroke-width="2.4" opacity="0.85"/>

  <!-- glowing core -->
  <circle cx="128" cy="128" r="46" fill="url(#core)" filter="url(#softglow)"/>
  <!-- diamond accent echoing the app favicon core -->
  <path d="M128 92 L164 128 L128 164 L92 128 Z" fill="none" stroke="#d8fbfd" stroke-width="1.5" opacity="0.5"/>
  <circle cx="128" cy="128" r="12" fill="#f2ffff"/>
</svg>
