name: Test & deploy E.V.

# On pull requests to main: lint + run the tests (no deploy).
# On push to main: lint + tests, then deploy to the VM ONLY if they pass.
# Secrets: SSH_PRIVATE_KEY, VM_IP, VM_USER. Secrets/.env stay on the VM.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -q ruff==0.16.3
      - run: ruff check ev tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: [test, lint]  # only runs if tests + lint pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key

      - name: Ship code and restart
        env:
          VM: ${{ secrets.VM_USER }}@${{ secrets.VM_IP }}
        run: |
          tar czf /tmp/ev.tgz ev run_telegram.py run_terminal.py run_web.py \
            requirements.txt deploy docs tests authorize_google.py README.md
          scp -i ~/.ssh/id_key -o StrictHostKeyChecking=accept-new \
            /tmp/ev.tgz "$VM:~/ev.tgz"
          ssh -i ~/.ssh/id_key -o StrictHostKeyChecking=accept-new "$VM" '
            cd ~/ev &&
            tar xzf ~/ev.tgz &&
            ./.venv/bin/pip install -q -r requirements.txt &&
            sudo systemctl restart ev &&
            (sudo systemctl restart ev-web 2>/dev/null || true) &&
            sleep 5 &&
            systemctl is-active ev'
