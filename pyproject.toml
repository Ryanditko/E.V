[project]
name = "ev"
version = "0.1.0"
description = "E.V. - Spidey AI Assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
]

[project.scripts]
ev = "ev.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev"]